name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Come Follow Me quizzes
        run: |
          python apps/scripture-copier/quizzes/test_quality.py
          python apps/scripture-copier/quizzes/validate.py
      - name: Build web publication package
        run: python scripts/build-pages.py --output "$RUNNER_TEMP/library-pages"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/library-pages
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
