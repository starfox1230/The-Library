name: Register Radiology Teaching Points Review

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  register-app:
    if: github.event.issue.title == 'Register Radiology Teaching Points Review App'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add temporary app registry entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path("apps/temporary-apps/index.html")
          text = index_path.read_text(encoding="utf-8-sig")
          app_path = "library/2026-07-18-radiology-teaching-points-review/index.html"

          if app_path not in text:
              marker = "    const TEMP_APPS = [\n"
              entry = '''      {
                name: "Radiology Teaching Points Review",
                path: "library/2026-07-18-radiology-teaching-points-review/index.html",
                createdAt: "2026-07-18",
                updatedAt: "2026-07-18",
                description: "A night-mode radiology teaching-point reviewer with tap-to-favorite selection, favorites-only filtering, search, persistent local saving, and one-click copying for Anki card creation.",
              },
          '''
              if marker not in text:
                  raise RuntimeError("TEMP_APPS marker not found")
              text = text.replace(marker, marker + entry, 1)
              index_path.write_text("\ufeff" + text, encoding="utf-8")
          PY

      - name: Verify temporary apps index
        run: python3 scripts/verify-temporary-apps-index.py

      - name: Commit registry update and remove one-time workflow
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/temporary-apps/index.html
          git rm .github/workflows/register-radiology-teaching-points-review.yml
          git commit -m "Register radiology teaching points review app"
          git push
          gh issue close "$ISSUE_NUMBER" --comment "Registered the app in the Temporary Apps Library and verified the index."
