2026-08-18T06:51:24-05:00","deck":"Other::Radiology (All)::.Visual::Everything Else","note_type":"saCloze+","tags":["#Radiology::Rotation::MSK","#Radiology::Visual"],"fields":{"Text":"<div><i>MSK Classification Systems<\/i><\/div><div><i><br><\/i><\/div><div>{{c1::Weber B}}<br><\/div><div><br><\/div><div><img src=\"paste-bea87b3e18963eff34b702b1e46aabe24fd7a9f3.jpg\"><br><\/div>","Extra":"<img src=\"906f702671cc469df3ba20b5193983_big_gallery.jpg\"><br><img src=\"f05a88c9a05fb5e60c6add353dcaac7680633907a32ff5d261b5b5fac7f6fa6b_jumbo.jpeg\"><br><ul><li><div><strong>type A<\/strong><\/div><ul><li><div>below the level of the syndesmosis (infrasyndesmotic)<\/div><\/li><li><div>usually transverse<\/div><\/li><li><div><a href=\"https://radiopaedia.org/articles/distal-tibiofibular-syndesmosis?lang=us\">tibiofibular syndesmosis<\/a>&nbsp;intact<\/div><\/li><li><div><a href=\"https://radiopaedia.org/articles/deltoid-ligament?lang=us\">deltoid ligament<\/a>&nbsp;intact<\/div><\/li><li><div><a href=\"https://radiopaedia.org/articles/missing?article%5Btitle%5D=medial-malleolus&amp;lang=us\">medial malleolus<\/a>&nbsp;occasionally fractured<\/div><\/li><li><div>usually stable if medial malleolus intact; treat with CAM Walker or Moon Boot with crutches and weight bear as tolerated with them for 6 weeks<\/div><\/li><\/ul><\/li><li><div><strong>type B<\/strong><\/div><ul><li><div>distal extent at the level of the syndesmosis (trans-syndesmotic); may extend some distance proximally<\/div><\/li><li><div>usually spiral&nbsp;<\/div><\/li><li><div>tibiofibular syndesmosis usually intact, but widening of the distal tibiofibular joint (especially on stressed views)&nbsp;indicates syndesmotic injury<\/div><\/li><li><div>medial malleolus may be fractured<\/div><\/li><li><div>deltoid ligament may be torn, indicated by widening of the space between the medial malleolus and talar dome<\/div><\/li><li><div>variable stability, dependent on the status of medial structures (malleolus/<a href=\"https://radiopaedia.org/articles/deltoid-ligament-of-the-ankle-1?lang=us\">deltoid ligament<\/a>) and syndesmosis; may require&nbsp;<a href=\"https://radiopaedia.org/articles/open-reduction-internal-fixation?lang=us\">open reduction and internal fixation (ORIF)<\/a><\/div><\/li><li><div>Weber B fractures could be further subclassified as&nbsp;<sup>9<\/sup><\/div><ul><li><div><strong>B1<\/strong>:&nbsp;isolated<\/div><\/li><li><div><strong>B2<\/strong>:&nbsp;associated with a medial lesion (malleolus or ligament)&nbsp;<\/div><\/li><li><div><strong>B3<\/strong>:&nbsp;associated with a medial lesion and fracture of posterolateral tibia&nbsp;<\/div><\/li><\/ul><\/li><\/ul><\/li><li><div><strong>type C<\/strong><\/div><ul><li><div>above the level of the syndesmosis (suprasyndesmotic)<\/div><\/li><li><div>tibiofibular syndesmosis disruption with widening of the distal tibiofibular articulation<\/div><\/li><li><div>medial malleolus fracture or&nbsp;<a href=\"https://radiopaedia.org/articles/deltoid-ligament-injury?lang=us\">deltoid ligament injury<\/a>&nbsp;often present<\/div><\/li><li><div>fracture may arise as proximally as the level of fibular neck and not visualized on ankle films, requiring knee or full-length tibia-fibula radiographs (<a href=\"https://radiopaedia.org/articles/maisonneuve-fracture?lang=us\">Maisonneuve fracture<\/a>)<\/div><\/li><li><div>unstable: usually requires&nbsp;<a href=\"https://radiopaedia.org/articles/open-reduction-internal-fixation?lang=us\">ORIF<\/a><\/div><\/li><li><div>Weber C fractures can be further subclassified as&nbsp;<sup>6<\/sup><\/div><ul><li><div><strong>C1<\/strong>: diaphyseal fracture of the fibula,&nbsp;simple<\/div><\/li><li><div><strong>C2<\/strong>: diaphyseal fracture of the fibula,&nbsp;complex<\/div><\/li><li><div><strong>C3<\/strong>: proximal fracture of the fibula<\/div><ul><li><div>a fracture above the syndesmosis results from external rotation or abduction forces that also disrupt the joint<\/div><\/li><li><div>usu "cloze\" data-ordinal=\"1\">Weber B<\/span><br><\/div><div><br><\/div><div><img src=\"media/paste-bea87b3e18963eff34b702b1e46aabe24fd7a9f3.jpg\"><br><\/div>\n<div>&nbsp;<\/div>\n<div id='extra'><img src=\"media/906f702671cc469df3ba20b5193983_big_gallery.jpg\"><br><img src=\"media/f05a88c9a05fb5e60c6add353dcaac7680633907a32ff5d261b5b5fac7f6fa6b_jumbo.jpeg\"><br><ul><li><div><strong>type A<\/strong><\/div><ul><li><div>below the level of the syndesmosis (infrasyndesmotic)<\/div><\/li><li><div>usually transverse<\/div><\/li><li><div><a href=\"https://radiopaedia.org/articles/distal-tibiofibular-syndesmosis?lang=us\">tibiofibular syndesmosis<\/a>&nbsp;intact<\/div><\/li><li><div><a href=\"https://radiopaedia.org/articles/deltoid-ligament?lang=us\">deltoid ligament<\/a>&nbsp;intact<\/div><\/li><li><div><a href=\"https://radiopaedia.org/articles/missing?article%5Btitle%5D=medial-malleolus&amp;lang=us\">medial malleolus<\/a>&nbsp;occasionally fractured<\/div><\/li><li><div>usually stable if medial malleolus intact; treat with CAM Walker or Moon Boot with crutches and weight bear as tolerated with them for 6 weeks<\/div><\/li><\/ul><\/li><li><div><strong>type B<\/strong><\/div><ul><li><div>distal extent at the level of the syndesmosis (trans-syndesmotic); may extend some distance proximally<\/div><\/li><li><div>usually spiral&nbsp;<\/div><\/li><li><div>tibiofibular syndesmosis usually intact, but widening of the distal tibiofibular joint (especially on stressed views)&nbsp;indicates syndesmotic injury<\/div><\/li><li><div>medial malleolus may be fractured<\/div><\/li><li><div>deltoid ligament may be torn, indicated by widening of the space between the medial malleolus and talar dome<\/div><\/li><li><div>variable stability, dependent on the status of medial structures (malleolus/<a href=\"https://radiopaedia.org/articles/deltoid-ligament-of-the-ankle-1?lang=us\">deltoid ligament<\/a>) and syndesmosis; may require&nbsp;<a href=\"https://radiopaedia.org/articles/open-reduction-internal-fixation?lang=us\">open reduction and internal fixation (ORIF)<\/a><\/div><\/li><li><div>Weber B fractures could be further subclassified as&nbsp;<sup>9<\/sup><\/div><ul><li><div><strong>B1<\/strong>:&nbsp;isolated<\/div><\/li><li><div><strong>B2<\/strong>:&nbsp;associated with a medial lesion (malleolus or ligament)&nbsp;<\/div><\/li><li><div><strong>B3<\/strong>:&nbsp;associated with a medial lesion and fracture of posterolateral tibia&nbsp;<\/div><\/li><\/ul><\/li><\/ul><\/li><li><div><strong>type C<\/strong><\/div><ul><li><div>above the level of the syndesmosis (suprasyndesmotic)<\/div><\/li><li><div>tibiofibular syndesmosis disruption with widening of the distal tibiofibular articulation<\/div><\/li><li><div>medial malleolus fracture or&nbsp;<a href=\"https://radiopaedia.org/articles/deltoid-ligament-injury?lang=us\">deltoid ligament injury<\/a>&nbsp;often present<\/div><\/li><li><div>fracture may arise as proximally as the level of fibular neck and not visualized on ankle films, requiring knee or full-length tibia-fibula radiographs (<a href=\"https://radiopaedia.org/articles/maisonneuve-fracture?lang=us\">Maisonneuve fracture<\/a>)<\/div><\/li><li><div>unstable: usually requires&nbsp;<a href=\"https://radiopaedia.org/articles/open-reduction-internal-fixation?lang=us\">ORIF<\/a><\/div><\/li><li><div>Weber C fractures can be further subclassified as&nbsp;<sup>6<\/sup><\/div><ul><li><div><strong>C1<\/strong>: diaphyseal fracture of the fibula,&nbsp;simple<\/div><\/li><li><div><strong>C2<\/strong>: diaphyseal fracture of the fibula,&nbsp;complex<\/div><\/li><li><div><strong>C3<\/strong>: proximal fracture of the fibula<\/div><ul><li><div>a fracture above the syndesmosis results from external rotation or abduction forces that also disrupt the joint<\/div><\/li><li><div>usually associated with an injury to the medial side<\/div><\/li><\/ul><\/li><\/ul><\/li><\/ul><\/li><\/ul><\/div>\n\n<\/div>\n\n\n<br>","front_text":"00:12\n\nMSK Classification Systems\n\n[...]","back_text":"00:08\n\nMSK Classification Systems\n\nWeber B\n\n-\ntype A\n\n-\nbelow the level of the syndesmosis (infrasyndesmotic)\n\n-\nusually transverse\n\n-\ntibiofibular syndesmosis intact\n\n-\ndeltoid ligament intact\n\n-\nmedial malleolus occasionally fractured\n\n-\nusually stable if medial malleolus intact; treat with CAM Walker or Moon Boot with crutches and weight bear as tolerated with them for 6 weeks\n\n-\ntype B\n\n-\ndistal extent at the level of the syndesmosis (trans-syndesmotic); may extend some distance proximally\n\n-\nusually spiral\n\n-\ntibiofibular syndesmosis usually intact, but widening of the distal tibiofibular joint (especially on stressed views) indicates syndesmotic injury\n\n-\nmedial malleolus may be fractured\n\n-\ndeltoid ligament may be torn, indicated by widening of the space between the medial malleolus and talar dome\n\n-\nvariable stability, dependent on the status of medial structures (malleolus/deltoid ligament) and syndesmosis; may require open reduction and internal fixation (ORIF)\n\n-\nWeber B fractures could be further subclassified as 9\n\n-\nB1: isolated\n\n-\nB2: associated with a medial lesion (malleolus or ligament)\n\n-\nB3: associated with a medial lesion and fracture of posterolateral tibia\n\n-\ntype C\n\n-\nabove the level of the syndesmosis (suprasyndesmotic)\n\n-\ntibiofibular syndesmosis disruption with widening of the distal tibiofibular articulation\n\n-\nmedial malleolus fracture or deltoid ligament injury often present\n\n-\nfracture may arise as proximally as the level of fibular neck and not visualized on ankle films, requiring knee or full-length tibia-fibula radiographs (Maisonneuve fracture)\n\n-\nunstable: usually requires ORIF\n\n-\nWeber C fractures can be further subclassified as 6\n\n-\nC1: diaphyseal fracture of the fibula, simple\n\n-\nC2: diaphyseal fracture of the fibula, complex\n\n-\nC3: proximal fracture of the fibula\n\n-\na fracture above the syndesmosis results from external rotation or abduction forces that also disrupt the joint\n\n-\nusually associated with an injury to the medial side","media":["906f702671cc469df3ba20b5193983_big_gallery.jpg","f05a88c9a05fb5e60c6add353dcaac7680633907a32ff5d261b5b5fac7f6fa6b_jumbo.jpeg","paste-bea87b3e18963eff34b702b1e46aabe24fd7a9f3.jpg"],"tracked_by_speed_streak":true},{"card_id":1762148398270,"note_id":1762148398270,"flagged_at":"2026-06-27T10:27:11-05:00","last_seen_at":"2026-08-18T06:23:26-05:00","deck":".NEW::Visual","note_type":"saCloze+","tags":[],"fields":{"Text":"What is the structure outlined in red?<br><br>{{c1::tegmen tympani}}<br><br><img src=\"paste-6c5ef9c252da9b8226c3d798524f6270c14ec34d.jpg\">","Extra":"<img src=\"paste-d368828a821594248390513cbb867f0106107304.jpg\">"},"front_html":"<style>html { overflow: scroll; overflow-x: hidden; }\n\n#kard {\n\tpadding: 0px 0px;\n\tbackground-color:;\n\tmax-width: 700px;\n\tmargin: 0 auto;\n\tword-wrap: break-word;\n\tbackground-color: ;\n}\n\n.card {\n\tfont-family: helvetica;\n\tfont-size: 20px;\n\ttext-align: center;\n\tcolor: #D7DEE9; /* FONT COLOR */\n\tline-height: 1.6em;\n\tbackground-color: #2F2F31; /* BACKGROUND COLOR -- \"#333B45\" is original */\n}\n\n.cloze, .cloze b, .cloze u, .cloze i { font-weight: bold; color: MediumSeaGreen !important;}\n\n\n\n/* --- Bar timer --- */\n.tbar{\n  position: sticky; top: 0; z-index: 1;\n  display: flex; align-items: center; gap: 10px;\n  padding: 6px 8px; margin: 0 0 12px 0;\n  background: rgba(16,24,40,.25); border: 1px solid rgba(34,50,77,.65);\n  border-radius: 12px; backdrop-filter: blur(6px);\n}\n.ttrack{\n  flex: 1 1 auto; height: 8px; border-radius: 999px;\n  background: #102035; border: 1px solid #22324d; overflow: hidden;\n}\n.tfill{\n  height: 100%; width: 100%; background: #27d3ff; /* JS updates color */\n  transform-origin: left center;\n}\n.tleft{\n  font-size: 12px; color: #A6ABB9; line-height: 1;\n  white-space: nowrap; font-variant-numeric: tabular-nums;\n  min-width: 52px; text ontal and occipital bossing, short broad hands and hypoplasia of nails, multiple long bone fractures following minimal trauma\n\nDiagnosis: Pyknodysostosis\n\nReveal Next\nToggle All\n\nThere is generalized osteosclerosis with narrowing of the medullary cavity. The fingers are short and stubby and there is partial agenesis/aplasia of terminal phalanges simulating acroosteolysis. When compared to a reference standard there is a two-year delay in hand bone age.\n\nThere is an incompletely healed transverse fracture of the tibial shaft.\n\nCore Radiology\n\nAnkiHub_Subdeck::AnKore_for_ABR_Diagnostic_Radiology_Core_Exam::Core_Radiology::13_Musculoskeletal_Imaging::08_Differential_diagnosis_of_common_bone_lesions Core_Radiology_2E\n\n×\n↪\n\nView Note on AnkiHub","media":["Screen Shot 2022-06-14 at 10.49.27 AM.jpg","_core_radiology.icon.png","paste-7a827e85ca898bec6094a1c154332d7040d5ff6d.jpg","paste-88324a363bd53596d393767e9fa412c88a732ba2.jpg"],"tracked_by_speed_streak":false},{"card_id":1760684722138,"note_id":1760684722137,"flagged_at":"2026-07-31T10:07:39-05:00","last_seen_at":"2026-07-31T10:07:39-05:00","deck":".NEW::Audio","note_type":"saCloze+","tags":["AnkiChat::2025.10.17_Cardiac_Imaging_Basics","leech"],"fields":{"Text":"Patchy mid-wall LGE favors {{c1::non-ischemic disease (e.g., hypertrophic cardiomyopathy, sarcoidosis)::what pathologies}}.","Extra":""},"front_html":"<style>html { overflow: scroll; overflow-x: hidden; }\n\n#kard {\n\tpadding: 0px 0px;\n\tbackground-color:;\n\tmax-width: 700px;\n\tmargin: 0 auto;\n\tword-wrap: break-word;\n\tbackground-color: ;\n}\n\n.card {\n\tfont-family: helvetica;\n\tfont-size: 20px;\n\ttext-align: center;\n\tcolor: #D7DEE9; /* FONT COLOR */\n\tline-height: 1.6em;\n\tbackground-color: #2F2F31; /* BACKGROUND COLOR -- \"#333B45\" is original */\n}\n\n.cloze, .cloze b, .cloze u, .cloze i { font-weight: bold; color: MediumSeaGreen !important;}\n\n\n\n/* --- Bar timer --- */\n.tbar{\n  position: sticky; top: 0; z-index: 1;\n  process the deferred problems I noticed during Anki review.\n\nThroughout the conversation, keep a running action list. At the end, organize the results into:\n\nEDIT EXISTING CARDS\n- Specific changes that should be made to existing cards.\n\nCREATE NEW CARDS\n- New cards or clarifying cards that should be created.\n\nDELETE / SUSPEND\n- Cards that are redundant, misleading, low-value, or should otherwise be removed from active review.\n\nCONCEPTS CLARIFIED — NO CARD CHANGE\n- Things I misunderstood or needed explained, but where the existing card is acceptable.\n\nNEEDS FURTHER RESEARCH\n- Items that require checking a source or learning more before changing anything.\n\nNO ACTION\n- Flagged cards that ultimately need no change.\n\nBe flexible if the conversation reveals another useful category or task."};
    const STORAGE_KEY = 'anki-review-later-view-v2';
    const entries = document.getElementById('entries');
    const period = document.getElementById('period');
    const dateInput = document.getElementById('date');
    const sort = document.getElementById('sort');
    const count = document.getElementById('count');
    const status = document.getElementById('status');
    const DAY = 86400000;

    function localDay(date) { return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }
    function addDays(date, days) { const result = new Date(date); result.setDate(result.getDate() + days); return result; }
    function dateValue(date) { const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0'); return `${y}-${m}-${d}`; }
    function parseDate(value) { const parsed = new Date(value); return Number.isNaN(parsed.getTime()) ? null : parsed; }
    function esc(value) { const node=document.createElement('div'); node.textContent=String(value??''); return node.innerHTML; }
    function pretty(value) { const parsed=parseDate(value); return parsed ? parsed.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : 'Unknown'; }
    function loadSettings() { try { return {...{mode:'range',days:1,dateOffset:0,sort:'seen'},...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}; } catch (_) { return {mode:'range',days:1,dateOffset:0,sort:'seen'}; } }
    let settings = loadSettings();
    function saveSettings() { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); }
    function applySettings() {
      period.value = settings.mode === 'date' ? 'date' : String(settings.days || 1);
      dateInput.hidden = settings.mode !== 'date';
      dateInput.value = dateValue(addDays(localDay(new Date()), Number(settings.dateOffset)||0));
      sort.value = settings.sort === 'flagged' ? 'flagged' : 'seen';
    }
    function visibleCards() {
      const today=localDay(new Date());
      const filtered=MODEL.cards.filter(card => {
        const seen=parseDate(card.last_seen_at); if (!seen) return false;
        const seenDay=localDay(seen);
        if (settings.mode === 'date') return seenDay.getTime() === addDays(today, Number(settings.dateOffset)||0).getTime();
        const start=addDays(today, -(Math.max(1,Number(settings.days)||1)-1));
        return seenDay >= start && seenDay <= today;
      });
      const key=settings.sort === 'flagged' ? 'flagged_at' : 'last_seen_at';
      return filtered.sort((a,b)=>(parseDate(b[key])?.getTime()||0)-(parseDate(a[key])?.getTime()||0));
    }
    function cardHtml(card,index) {
      return `<article class="entry" data-card-id="${card.card_id}">
        <header class="entry-head"><div><div class="number">Card ${index+1}</div><div class="deck">${esc(card.deck||'Unknown Deck')}</div></div>
        <div class="times">Seen ${esc(pretty(card.last_seen_at))}<br>Flagged ${esc(pretty(card.flagged_at))}</div></header>
        <div class="stage" tabindex="0" role="button" aria-label="Show answer" aria-pressed="false">
          <section class="side front active"><div class="face-label">Question</div><div class="card-preview card">${card.front_html||'<em>(empty)</em>'}</div></section>

    function toggle(stage) {
      const front=stage.querySelector('.front'),back=stage.querySelector('.back');
      const showingAnswer=back.classList.contains('active');
      const current=showingAnswer?back:front,next=showingAnswer?front:back;
      const startHeight=stage.getBoundingClientRect().height;
      stage.style.height=`${startHeight}px`;
      current.classList.remove('active'); current.hidden=true;
      next.hidden=false; next.classList.add('active');
      const targetHeight=next.getBoundingClientRect().height;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ stage.style.height=`${targetHeight}px`; }));
      const release=()=>{ stage.style.height='auto'; };
      stage.addEventListener('transitionend',release,{once:true});

    function render() {
      const cards=visibleCards(); count.textContent=`${cards.length} card${cards.length===1?'':'s'}`;
      entries.innerHTML=cards.length ? cards.map(cardHtml).join('') : '<div class="empty">No currently blue cards were seen in this period.</div>';
      entries.querySelectorAll('.stage').forEach(stage => {
        stage.addEventListener('click',event=>{ if (!event.target.closest('a,button,input,select,textarea')) toggle(stage); });
        stage.addEventListener('keydown',event=>{ if (event.key==='Enter'||event.key===' ') { event.preventDefault(); toggle(stage); } });
      });
    }
    function cardsMarkdown(cards) {
      const lines=['# Anki Speed Streak — Review Later','',`Cards: ${cards.length}`];
      if (!cards.length) return lines.concat(['','No currently blue cards were seen in this period.']).join('\n')+'\n';
      cards.forEach((card,index)=>lines.push('',`## Card ${index+1}`,'',`Deck: ${card.deck||'Unknown Deck'}`,`Flagged: ${card.flagged_at||'Unknown'}`,`Last seen: ${card.last_seen_at||'Unknown'}`,`Card ID: ${card.card_id}`,`Note ID: ${card.note_id}`,'','Question:',card.front_text||'(empty)','','Answer:',card.back_text||'(empty)'));
      return lines.join('\n')+'\n';
    }
    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      const area=document.createElement('textarea'); area.value=text; area.readOnly=true; area.style.cssText='position:fixed;opacity:0'; document.body.appendChild(area); area.select();
      if (!document.execCommand('copy')) throw new Error('copy unavailable'); area.remove();
    }
    async function copy(kind,button) {
      const cards=visibleCards(),body=cardsMarkdown(cards); const payload=kind==='chat'?`# Standing instructions\n\n${MODEL.instructions.trim()}\n\n---\n\n${body}`:body;
      try { await copyText(payload); status.textContent=`Copied ${cards.length} visible card${cards.length===1?'':'s'}`; button.textContent='Copied'; }
      catch (_) { status.textContent='Copy blocked'; }
      setTimeout(()=>{ button.textContent=kind==='chat'?'ChatGPT':'Cards'; status.textContent=''; },1600);
    }
    period.addEventListener('change',()=>{ if(period.value==='date'){settings.mode='date';}else{settings.mode='range';settings.days=Number(period.value);} applySettings();saveSettings();render(); });
    dateInput.addEventListener('change',()=>{ const chosen=new Date(`${dateInput.value}T12:00:00`); settings.dateOffset=Math.round((localDay(chosen)-localDay(new Date()))/DAY);saveSettings();render(); });
    sort.addEventListener('change',()=>{ settings.sort=sort.value;saveSettings();render(); });
    document.getElementById('copyChat').addEventListener('click',event=>copy('chat',event.currentTarget));
    document.getElementById('copyCards').addEventListener('click',event=>copy('cards',event.currentTarget));
    applySettings(); render();
  </script>
</body>
</html>
