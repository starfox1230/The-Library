<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recorder Link</title>
    <style>
      body { width: 280px; margin: 0; padding: 16px; color: #eef4fc; background: #09101c; font: 13px "Segoe UI", sans-serif; }
      h1 { margin: 0 0 8px; font-size: 17px; }
      #status { padding: 10px; border: 1px solid #2d4665; border-radius: 8px; background: #101b2b; line-height: 1.45; }
      .good { color: #7ce5b2; }
      .bad { color: #ff929d; }
      .muted { color: #9eb0c8; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>Screen Capture Link</h1>
    <div id="status">Checking the local recorder…</div>
    <div class="muted">Open the desktop recorder first. Medality/Vimeo and YouTube players are detected automatically.</div>
    <script src="popup.js"></script>
  </body>
</html>
