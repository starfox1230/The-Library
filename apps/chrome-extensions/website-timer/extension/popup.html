<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Timer · limits</title><link rel="stylesheet" href="ui.css"></head>
<body>
<main>
  <header><div class="mark" aria-hidden="true">◷</div><div><p class="eyebrow">A LITTLE MORE INTENTION</p><h1>Website Timer</h1></div></header>
  <p class="intro">Keep an eye on the scroll. Set a stopping point.</p>
  <p class="date" id="day">Today</p>
  <form id="settings">
    <div id="sites"></div>
    <div class="save-row"><button class="primary" type="submit">Save limits</button><p id="status" role="status" aria-live="polite"></p></div>
  </form>
  <footer>Only focused browsing counts. Pauses after 60 seconds idle.<br>Daily totals and blocks reset at local midnight. Stored on this device.</footer>
</main>
<script src="core.js"></script><script src="popup.js"></script>
</body></html>
