<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed Streak 2.04 AnkiWeb preview</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef0f3;
      color: #202124;
      font: 15px/1.55 Arial, Helvetica, sans-serif;
    }
    main {
      width: min(780px, calc(100% - 28px));
      margin: 28px auto;
      padding: 28px 34px 44px;
      background: white;
      border: 1px solid #d8dce3;
      box-shadow: 0 3px 18px rgba(30, 40, 55, .09);
    }
    h1 { margin: 0 0 8px; font-size: 34px; }
    h2 { margin: 34px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #e1e5eb; }
    a { color: #2667b8; }
    img { height: auto; }
    td { line-height: 1.38; }
    small { color: #5e6672; }
    @media (max-width: 620px) {
      main { width: 100%; margin: 0; padding: 20px 14px 36px; border: 0; }
      table { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main id="description" aria-label="AnkiWeb description preview"></main>
  <script>
    fetch("ankiweb-description.html")
      .then((response) => response.text())
      .then((markup) => {
        const description = document.getElementById("description");
        description.innerHTML = markup;
        description.querySelectorAll("img").forEach((image) => {
          const filename = image.src.split("/").pop();
          image.src = `assets/${filename}`;
        });
      });
  </script>
</body>
</html>
