<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed Streak AnkiWeb text preview</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f1f2f4;
      color: #202124;
      font: 15px/1.55 Arial, Helvetica, sans-serif;
    }
    .page {
      width: min(760px, calc(100% - 32px));
      margin: 30px auto;
      background: #fff;
      border: 1px solid #d9dce1;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
    }
    iframe { display: block; width: 100%; height: 1800px; border: 0; }
    @media (max-width: 600px) {
      .page { width: 100%; margin: 0; border: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <iframe src="ankiweb-description.html" title="Speed Streak AnkiWeb description preview"></iframe>
  </main>
</body>
</html>
