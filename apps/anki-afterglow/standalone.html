<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afterglow · Standalone comparison</title><link rel="stylesheet" href="web/afterglow.css"><style>
body{margin:0;color:#dfedff;font:12px system-ui}#controls{position:fixed;right:15px;top:15px;padding:14px;background:#070c1cd9;border:1px solid #60708755;border-radius:12px;max-width:350px}p{color:#9db2c8;line-height:1.6}button,select{background:#192338;color:#e2f0ff;border:1px solid #657d9855;border-radius:7px;padding:7px;margin-right:5px;cursor:pointer}#performance{white-space:pre-line;font-variant-numeric:tabular-nums}
</style></head><body><section id="controls"><b>AFTERGLOW · STANDALONE</b><p>Real system audio, rendered outside Anki. Compare the motion and frame rate while Anki is also open.</p><select id="visual"><option value="particles">Particle cloud</option><option value="liquid">Liquid wall</option></select><select id="quality"><option value="1">Smooth</option><option value="0">Economy</option></select><p id="performance">Starting audio…</p><button id="fullscreen">Fullscreen</button><button id="hide">Hide controls (H)</button><button id="stop">Stop</button></section>
<script src="web/liquid.js"></script><script src="web/particles.js"></script><script src="web/afterglow.js"></script><script>
const config={enabled:true,motion:55,intensity:80,contrast:70,quality:1,palette:'ember',impact:65,show_meter:true,visual:'particles'};let stopped=false;
async function poll(){if(stopped)return;try{const response=await fetch('/state');if(!response.ok)throw Error('Audio service unavailable');const state=await response.json();Afterglow.update({...state,config,primary:true});const m=Afterglow.metrics();document.getElementById('performance').textContent=Math.round(m.fps)+' FPS · p95 '+m.p95_ms.toFixed(1)+' ms\n'+m.device+'\n'+(state.device||state.status);}catch(e){document.getElementById('performance').textContent=e.message;}setTimeout(poll,40);}poll();
document.getElementById('visual').onchange=e=>config.visual=e.target.value;
document.getElementById('quality').onchange=e=>config.quality=+e.target.value;
document.getElementById('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
function toggle(){const c=document.getElementById('controls');c.hidden=!c.hidden;}document.getElementById('hide').onclick=toggle;addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')toggle();});
document.getElementById('stop').onclick=async()=>{stopped=true;await fetch('/stop',{method:'POST'});Afterglow.update({config:{enabled:false}});document.getElementById('performance').textContent='Stopped. You can close this window.';};
</script></body></html>
