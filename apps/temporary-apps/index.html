<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Temporary Apps Library</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(145deg, #0f172a, #111827);
      color: #e5e7eb;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .panel {
      width: min(620px, 100%);
      padding: 24px;
      border: 1px solid #374151;
      border-radius: 16px;
      background: rgba(31, 41, 55, .92);
      text-align: center;
    }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 16px;
      border: 4px solid #374151;
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    a { color: #22d3ee; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main id="status" class="panel">
    <div class="spinner" aria-hidden="true"></div>
    <strong>Loading Temporary Apps Library…</strong>
  </main>

  <script>
    const CATALOG_SNAPSHOT = "https://raw.githubusercontent.com/starfox1230/The-Library/dc9e6bd92b338b3472843ffaf53ea8346b282160/apps/temporary-apps/index.html";
    const APP_ENTRIES = `      {
        name: "Liver Imaging Teaching Points Review",
        path: "library/2026-07-19-liver-imaging-teaching-points-review/index.html",
        createdAt: "2026-07-19",
        updatedAt: "2026-07-19",
        description: "A comprehensive night-mode liver-imaging reviewer with tap-to-favorite facts, favorites-only filtering, search, persistent local saving, copying for Anki creation, and an organized liver-lesion algorithm.",
      },
      {
        name: "Radiology Teaching Points Review",
        path: "library/2026-07-18-radiology-teaching-points-review/index.html",
        createdAt: "2026-07-18",
        updatedAt: "2026-07-18",
        description: "A night-mode radiology teaching-point reviewer with tap-to-favorite selection, favorites-only filtering, search, persistent local saving, and one-click copying for Anki card creation.",
      },
`;

    fetch(CATALOG_SNAPSHOT, { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      })
      .then(source => {
        const marker = "    const TEMP_APPS = [\n";
        if (!source.includes(marker)) throw new Error("TEMP_APPS marker not found");
        const updatedSource = source.replace(marker, marker + APP_ENTRIES);
        document.open();
        document.write(updatedSource);
        document.close();
      })
      .catch(error => {
        document.getElementById("status").innerHTML = `
          <h1>Temporary Apps Library</h1>
          <p>The full catalog could not be loaded: ${error.message}</p>
          <p><a href="library/2026-07-19-liver-imaging-teaching-points-review/index.html">Open Liver Imaging Teaching Points Review</a></p>
          <p><a href="library/2026-07-18-radiology-teaching-points-review/index.html">Open Radiology Teaching Points Review</a></p>
        `;
      });
  </script>
</body>
</html>
