<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Loading Liver Imaging Teaching Points…</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #090d18;
      color: #edf2ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .loading { text-align: center; }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 16px;
      border: 4px solid #26334f;
      border-top-color: #9b8cff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .error { max-width: 620px; color: #ffb4c0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="status" class="loading">
    <div class="spinner" aria-hidden="true"></div>
    <div>Loading liver imaging teaching points…</div>
  </div>
  <script>
    const parts = [
      "data/part-01.b64",
      "data/part-02.b64",
      "data/part-03.b64",
      "data/part-04.b64",
      "data/part-05.b64",
      "data/part-06.b64",
      "data/part-07.b64"
    ];

    Promise.all(parts.map(async path => {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
      return (await response.text()).trim();
    }))
      .then(chunks => {
        const binary = atob(chunks.join(""));
        const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
        let html = new TextDecoder("utf-8").decode(bytes);

        // Repair the original generated page, whose outline was inserted with
        // literal newlines inside a quoted JavaScript string. That syntax error
        // prevented all teaching points and controls from initializing.
        const startMarker = 'const OUTLINE = "';
        const endMarker = '";\n    const STORAGE_KEY';
        const start = html.indexOf(startMarker);
        const end = start >= 0 ? html.indexOf(endMarker, start + startMarker.length) : -1;

        if (start >= 0 && end > start) {
          const rawOutline = html.slice(start + startMarker.length, end);
          if (rawOutline.includes("\n")) {
            html =
              html.slice(0, start) +
              "const OUTLINE = " + JSON.stringify(rawOutline) + ";\n    const STORAGE_KEY" +
              html.slice(end + endMarker.length);
          }
        }

        document.open();
        document.write(html);
        document.close();
      })
      .catch(error => {
        const status = document.getElementById("status");
        status.className = "error";
        status.innerHTML = `<h1>Unable to load the app</h1><p>${error.message}</p><p>Refresh the page after GitHub Pages finishes publishing the latest files.</p>`;
      });
  </script>
</body>
</html>
