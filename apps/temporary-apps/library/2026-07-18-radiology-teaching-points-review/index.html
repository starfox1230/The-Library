<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Loading Radiology Teaching Points…</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #090d18;
      color: #edf2ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .loading { text-align: center; }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 16px;
      border: 4px solid #26334f;
      border-top-color: #9b8cff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .error { max-width: 620px; color: #ffb4c0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="status" class="loading">
    <div class="spinner" aria-hidden="true"></div>
    <div>Loading radiology teaching points…</div>
  </div>
  <script>
    const parts = [
      "parts/part-01.txt",
      "parts/part-02.txt",
      "parts/part-03.txt",
      "parts/part-04.txt",
      "parts/part-05.txt",
      "parts/part-06.txt",
      "parts/part-07.txt",
      "parts/part-08.txt"
    ];

    Promise.all(parts.map(async path => {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
      return response.text();
    }))
      .then(chunks => {
        document.open();
        document.write(chunks.join(""));
        document.close();
      })
      .catch(error => {
        const status = document.getElementById("status");
        status.className = "error";
        status.innerHTML = `<h1>Unable to load the app</h1><p>${error.message}</p><p>Refresh the page after GitHub Pages finishes publishing the latest files.</p>`;
      });
  </script>
</body>
</html>
