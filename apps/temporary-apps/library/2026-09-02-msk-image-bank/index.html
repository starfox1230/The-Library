<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1018">
  <title>MSK Image Bank</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1018; --panel:#111925; --panel2:#172131; --line:#26364a; --text:#e7edf5; --muted:#8ea0b6; --accent:#67e8f9; --accent2:#22d3ee; --star:#facc15; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,input,textarea { font:inherit; }
    button { border:1px solid var(--line); border-radius:7px; background:#182536; color:var(--text); cursor:pointer; padding:7px 10px; }
    button:hover { border-color:var(--accent2); background:#20354c; } button.primary { background:#0e7490; border-color:#22d3ee; }
    .app { display:grid; grid-template-columns:300px minmax(0,1fr); min-height:100vh; }
    aside { border-right:1px solid var(--line); background:#0e1622; display:flex; flex-direction:column; min-height:100vh; }
    .brand { padding:18px 16px 12px; border-bottom:1px solid var(--line); } .brand h1 { margin:0; font-size:18px; } .brand p { color:var(--muted); margin:4px 0 0; font-size:12px; }
    .sidebar-tools { padding:12px; display:grid; gap:8px; border-bottom:1px solid var(--line); }
    input,textarea { background:#0b131f; border:1px solid var(--line); color:var(--text); border-radius:7px; padding:8px 9px; } input:focus,textarea:focus { outline:2px solid #155e75; border-color:var(--accent2); }
    .toggle-row { display:flex; gap:7px; align-items:center; color:var(--muted); font-size:12px; } .toggle-row input { accent-color:var(--accent2); }
    #pathologyList { overflow:auto; padding:8px; } .group-label { color:#6f849d; text-transform:uppercase; letter-spacing:.08em; font-size:10px; padding:10px 8px 4px; }
    .pathology { display:flex; gap:6px; align-items:center; width:100%; text-align:left; border:0; background:transparent; padding:7px 8px; border-radius:6px; color:var(--text); } .pathology:hover,.pathology.active { background:var(--panel2); }
    .pathology .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; } .star { color:#53667e; font-size:15px; } .star.on { color:var(--star); }
    main { min-width:0; } .topbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:14px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(11,16,24,.94); backdrop-filter:blur(8px); z-index:2; }
    .topbar .status { color:var(--muted); font-size:12px; } .actions { display:flex; gap:7px; flex-wrap:wrap; } .content { max-width:1250px; padding:22px 24px 48px; margin:auto; }
    .empty { color:var(--muted); border:1px dashed var(--line); border-radius:10px; padding:28px; text-align:center; } .detail-head { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:18px; }
    .detail-head h2 { margin:0 0 4px; font-size:24px; line-height:1.2; } .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.1em; font-size:10px; font-weight:700; } .subtle { color:var(--muted); font-size:12px; }
    .modality-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; } .modality { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; min-width:0; }
    .modality-head { padding:12px 13px 9px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; } .modality-head h3 { margin:0; font-size:15px; }
    .search-links { display:flex; gap:6px; padding:10px 12px 0; } .search-links a { color:var(--accent); border:1px solid #24546b; border-radius:5px; padding:4px 7px; text-decoration:none; font-size:11px; } .search-links a:hover { background:#123447; }
    .findings { padding:10px 12px 12px; } .findings label,.notes label { display:block; color:var(--muted); font-size:11px; margin-bottom:5px; } .finding { width:100%; min-height:80px; resize:vertical; font-size:12px; }
    .collection { margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; } .collection-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
    .dropzone { border:1px dashed #3f607a; background:#0d1723; color:var(--muted); border-radius:8px; padding:14px; text-align:center; font-size:12px; } .dropzone.drag { border-color:var(--accent); background:#102b38; color:var(--text); } .dropzone strong { color:var(--accent); }
    .image-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; margin-top:11px; } .image-card { border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#0c141f; }
    .image-card .preview { height:150px; background:#070c13; display:flex; align-items:center; justify-content:center; } .image-card img { max-width:100%; max-height:100%; object-fit:contain; } .image-card .image-info { padding:8px; display:grid; gap:6px; } .image-card input { width:100%; font-size:12px; }
    .image-actions { display:flex; justify-content:space-between; align-items:center; gap:5px; } .image-actions button { padding:4px 7px; font-size:11px; } .notes { margin-top:16px; } .notes textarea { width:100%; min-height:62px; resize:vertical; font-size:12px; } .tip { color:var(--muted); font-size:11px; margin-top:10px; }
    .toast { position:fixed; right:20px; bottom:20px; padding:10px 13px; background:#164e63; border:1px solid var(--accent2); border-radius:8px; color:#ecfeff; opacity:0; transform:translateY(8px); transition:.18s; pointer-events:none; } .toast.show { opacity:1; transform:none; }
    @media (max-width:850px) { .app { grid-template-columns:1fr; } aside { min-height:auto; max-height:39vh; border-right:0; border-bottom:1px solid var(--line); } #pathologyList { max-height:23vh; } .modality-grid { grid-template-columns:1fr; } .content { padding:18px 13px 35px; } .topbar { position:static; padding:12px 13px; } .detail-head h2 { font-size:20px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside><div class="brand"><h1>MSK Image Bank</h1><p>Fast visual curation · saved on this device</p></div><div class="sidebar-tools"><input id="searchInput" type="search" placeholder="Search pathology…" autocomplete="off"><label class="toggle-row"><input id="favoritesOnly" type="checkbox"> Favorites only</label></div><div id="pathologyList"></div></aside>
    <main><div class="topbar"><div class="status" id="status">50 starter diagnoses · local browser storage</div><div class="actions"><button id="addBtn" class="primary">＋ Diagnosis</button><button id="openAllBtn">Open 3 searches</button><button id="copyBtn">Copy favorites</button><button id="exportBtn">Export</button><button id="importBtn">Import</button><input id="importInput" type="file" accept="application/json" hidden><input id="imagePicker" type="file" accept="image/*" multiple hidden></div></div><div class="content" id="detail"></div></main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="data.js"></script><script src="app.js"></script>
</body>
</html>
