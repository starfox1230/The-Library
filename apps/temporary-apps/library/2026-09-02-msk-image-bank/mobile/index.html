<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#080d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MSK Image Bank Mobile</title>
  <style>
    :root { color-scheme:dark; --bg:#080d14; --panel:#111a27; --line:#26364a; --text:#e7edf5; --muted:#8ea0b6; --accent:#67e8f9; --gold:#facc15; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; overflow:hidden; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
    .topbar { position:fixed; z-index:5; inset:0 0 auto; height:58px; padding:8px 12px; padding-top:max(8px,env(safe-area-inset-top)); background:rgba(8,13,20,.96); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:9px; }
    select { min-width:0; flex:1; height:40px; padding:0 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); font:inherit; }
    .counter { min-width:54px; text-align:right; color:var(--muted); font-size:11px; }
    #stage { position:fixed; inset:58px 0 0; overflow:hidden; touch-action:none; background:radial-gradient(circle at 50% 45%,#142333 0,#080d14 62%); }
    #track { width:100%; height:100%; transition:transform 140ms ease-out; }
    .slide { width:100%; height:100%; padding:20px 18px 34px; display:flex; align-items:center; justify-content:center; position:relative; }
    .slide img { display:block; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; pointer-events:none; }
    .label { position:absolute; left:14px; right:14px; bottom:8px; display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:11px; text-shadow:0 1px 4px #000; }
    .empty { height:100%; display:grid; place-items:center; padding:30px; color:var(--muted); text-align:center; }
    #loading { position:fixed; z-index:10; inset:58px 0 0; display:grid; place-items:center; background:rgba(8,13,20,.94); color:var(--muted); }
    #loading[hidden] { display:none; }
    .loader { display:grid; justify-items:center; gap:13px; }
    .spinner { width:28px; height:28px; border:3px solid #294052; border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .error { padding:24px; color:#fda4af; text-align:center; }
  </style>
</head>
<body>
  <header class="topbar">
    <select id="pathologySelect" aria-label="Select pathology"></select>
    <div class="counter" id="counter">—</div>
  </header>
  <main id="stage" aria-label="Image review area">
    <div id="track"></div>
  </main>
  <div id="loading" hidden><div class="loader"><div class="spinner"></div><div id="loadingText">Loading images…</div></div></div>
  <script src="../data.js"></script>
  <script src="app.js"></script>
</body>
</html>
